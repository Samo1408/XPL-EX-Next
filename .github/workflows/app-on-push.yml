
name: Build and publish XPL-EX-NEXT v1.6.6

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: xpl-ex-next-v1.6.6-release
  cancel-in-progress: false

env:
  RELEASE_TAG: XPL-EX-NEXT-v1.6.6
  RELEASE_TITLE: XPL-EX-NEXT v1.6.6
  BUILD_APK: XPL-EX-NEXT-1.6.6-release.apk
  RELEASE_APK: XPL-EX-NEXT-1.6.6.apk
  VERSION_NAME: "1.6.6"
  VERSION_CODE: "172"

jobs:
  build-and-release:
    name: Build, verify and publish APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: "17"

      - name: Install required Android SDK packages
        run: |
          set -euo pipefail

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="${sdk_root}/cmdline-tools/latest/bin/sdkmanager"

          test -x "${sdkmanager_path}"

          echo "ANDROID_HOME=${sdk_root}" >> "${GITHUB_ENV}"
          echo "ANDROID_SDK_ROOT=${sdk_root}" >> "${GITHUB_ENV}"

          "${sdkmanager_path}" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build release APK
        run: |
          set -euo pipefail

          chmod +x gradlew

          for attempt in 1 2 3; do
            if ./gradlew --no-daemon clean testReleaseUnitTest assembleRelease; then
              break
            fi

            if [[ "${attempt}" -eq 3 ]]; then
              echo "Gradle build failed after 3 attempts." >&2
              exit 1
            fi

            echo "Build attempt ${attempt} failed; retrying."
            sleep $((attempt * 15))
          done

      - name: Verify APK version and stage artifact
        id: apk
        run: |
          set -euo pipefail

          source_apk="app/build/outputs/apk/release/${BUILD_APK}"
          test -f "${source_apk}"

          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          badging=$("${build_tools}/aapt" dump badging "${source_apk}")

          grep -Fq "versionCode='${VERSION_CODE}'" <<< "${badging}"
          grep -Fq "versionName='${VERSION_NAME}'" <<< "${badging}"

          mkdir -p dist
          cp "${source_apk}" "dist/${RELEASE_APK}"

          (
            cd dist
            sha256sum "${RELEASE_APK}" > "${RELEASE_APK}.sha256"
          )

          apk_sha256=$(cut -d' ' -f1 "dist/${RELEASE_APK}.sha256")

          echo "sha256=${apk_sha256}" >> "${GITHUB_OUTPUT}"

          echo "APK version verified successfully."
          echo "Signing certificate verification is currently skipped."

      - name: Prepare release description
        run: |
          set -euo pipefail

          test -f docs/releases/xpl-ex-next-v1.6.6.md

          cp docs/releases/xpl-ex-next-v1.6.6.md \
            "${RUNNER_TEMP}/release-notes.md"

      - name: Write build summary
        env:
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          {
            echo "# ${RELEASE_TITLE}"
            echo
            echo "- Tests: passed"
            echo "- Version name: ${VERSION_NAME}"
            echo "- Version code: ${VERSION_CODE}"
            echo "- libxposed API: 101"
            echo "- Bridge protocol: 1.5.5"
            echo "- R8 minification: disabled for Xposed/Lua hook compatibility"
            echo "- APK: ${RELEASE_APK}"
            echo "- SHA-256: ${APK_SHA256}"
            echo "- Signing certificate verification: skipped"
            echo "- Release tag: ${RELEASE_TAG}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPL-EX-NEXT-1.6.6
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: |
            dist/${{ env.RELEASE_APK }}
            dist/${{ env.RELEASE_APK }}.sha256
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
